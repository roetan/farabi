<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>PLAYER</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/shaka-player.compiled.js"></script>

<style>
body {
  margin: 0;
  background: #0b1730;
  font-family: Arial;
  color: white;
}

/* ================= LAYOUT DESKTOP ================= */
.container {
  display: flex;
  height: 100vh;
}

/* PLAYER */
.player {
  flex: 3;
  background: black;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* SIDEBAR */
.sidebar {
  flex: 1;
  background: #0f1f3d;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* FILTER */
.filter {
  padding: 10px;
  background: #142a52;
}

select {
  width: 100%;
  padding: 10px;
  border-radius: 6px;
  border: none;
}

/* LIST */
.list {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.item {
  padding: 12px;
  margin-bottom: 8px;
  background: #1c2b4a;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}

.item:hover { background: #2c3e66; }
.item.active { background: #2f5bd3; }

/* ================= TABLET ================= */
@media (max-width: 900px) {

  .container {
    flex-direction: column;
    height: 100vh;
  }

  .player {
    flex: none;
    height: 45vh;
  }

  .sidebar {
    flex: 1;
    height: 55vh;
  }

  .item {
    font-size: 13px;
    padding: 10px;
  }
}

/* ================= HP ================= */
@media (max-width: 768px) {

  .player {
    height: 40vh;
  }

  .sidebar {
    height: 60vh;
  }

  .filter {
    padding: 8px;
  }

  select {
    padding: 8px;
    font-size: 14px;
  }

  .item {
    font-size: 12px;
    padding: 10px;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="player">
    <video id="video" controls autoplay></video>
  </div>

  <div class="sidebar">

    <!-- DROPDOWN KATEGORI -->
    <div class="filter">
      <select id="category"></select>
    </div>

    <div class="list" id="list"></div>

  </div>
</div>

<script>
const video = document.getElementById("video");
const list = document.getElementById("list");
const category = document.getElementById("category");

let player;
let channels = [];
let filtered = [];

const SOURCE_URL =
"https://raw.githubusercontent.com/roetan/utilisasi/refs/heads/main/event.txt";

/* ================= SHAKA INIT ================= */
shaka.polyfill.installAll();

if (shaka.Player.isBrowserSupported()) {
  player = new shaka.Player(video);

  player.addEventListener("error", e => {
    console.error("SHAKA ERROR:", e.detail);
  });
}

/* ================= LOAD DATA ================= */
fetch(SOURCE_URL)
.then(r => r.text())
.then(text => {

  channels = text.trim().split("\n").map(line => {
    const p = line.split("|");

    return {
      date: p[0],
      title: p[1],
      url: p[2],
      drm: p[3] || null
    };
  });

  initCategory();
  setFilter(category.value || getFirstDate());

});

/* ================= GET UNIQUE DATE ================= */
function initCategory() {

  const dates = [...new Set(channels.map(c => c.date))];

  category.innerHTML = "";

  dates.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d;
    opt.textContent = d;
    category.appendChild(opt);
  });

}

/* ================= FILTER ================= */
function setFilter(date) {

  filtered = channels.filter(c => c.date === date);

  render();
}

/* ================= DRM ================= */
function applyDRM(ch) {

  if (!ch.drm) return;

  if (ch.drm.includes(":") && !ch.drm.startsWith("http")) {

    const [kid, key] = ch.drm.split(":");

    player.configure({
      drm: {
        clearKeys: {
          [kid.trim()]: key.trim()
        }
      }
    });

    return;
  }

  if (ch.drm.startsWith("http")) {

    player.configure({
      drm: {
        servers: {
          "com.widevine.alpha": ch.drm
        }
      }
    });

    return;
  }
}

/* ================= PLAY ================= */
async function play(ch, el) {

  document.querySelectorAll(".item")
    .forEach(x => x.classList.remove("active"));

  el.classList.add("active");

  try {

    await player.unload();

    applyDRM(ch);

    console.log("PLAY:", ch.title);

    await player.load(ch.url);

  } catch (e) {
    console.error(e);
  }
}

/* ================= RENDER ================= */
function render() {

  list.innerHTML = "";

  filtered.forEach((ch, i) => {

    const div = document.createElement("div");
    div.className = "item";
    div.textContent = ch.title;

    div.onclick = () => play(ch, div);

    list.appendChild(div);

    if (i === 0) play(ch, div);
  });

}

/* ================= EVENT ================= */
category.addEventListener("change", e => {
  setFilter(e.target.value);
});

/* ================= DEFAULT ================= */
function getFirstDate() {
  return channels.length ? channels[0].date : "";
}
</script>

</body>
</html>
