name: Fetch Temporary Channels

on:
  schedule:
    - cron: '0 * * * *' # setiap 1 jam
  workflow_dispatch:

jobs:
  fetch-temp-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Fetch and filter temporary.txt
        run: |
          python - <<'EOF'
          import requests
          import sys

          url = "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt"
          output_file = "temporary.txt"

          ignore_start_line = "Live Sports Streaming\t`0https://www.marza12.shop/football.html"
          ignore_end_line = "^@[].f Two Pop-Ups: Ads and The Live Streaming"

          try:
              response = requests.get(url, timeout=30)
              response.raise_for_status()
              lines = response.text.splitlines()
          except Exception as e:
              print("Gagal fetch URL:", e)
              sys.exit(1)

          output_lines = []
          skip = True  # skip sampai ignore_start_line ditemukan
          end_count = 0  # hitung kemunculan baris akhir

          for line in lines:
              line_strip = line.strip()

              # mulai ambil setelah ignore_start_line
              if skip:
                  if line_strip == ignore_start_line:
                      skip = False
                  continue

              # hitung kemunculan ignore_end_line
              if line_strip == ignore_end_line:
                  end_count += 1
                  if end_count == 2:
                      break  # stop membaca dari kemunculan kedua
                  continue

              output_lines.append(line)

          # tulis ke temporary.txt
          with open(output_file, 'w', encoding='utf-8') as f:
              f.write("\n".join(output_lines))

          print(f"{output_file} berhasil dibuat, total {len(output_lines)} baris.")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add temporary.txt
          git diff-index --quiet HEAD || git commit -m "Update temporary.txt"
          git push
