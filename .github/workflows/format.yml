name: Format

on:
  schedule:
    - cron: '0 * * * *'  # setiap jam
  workflow_dispatch:

jobs:
  format-m3u8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch TXT and Reformat
        run: |
          python - << 'EOF'
          import re
          import requests

          url = "https://raw.githubusercontent.com/roetan/farabi/refs/heads/main/blocks_m3u8_filtered.txt"
          txt = requests.get(url).text.splitlines()

          output_lines = []
          current_time = ""
          current_league = ""

          header_pattern = re.compile(r"(\d{2}:\d{2}) \[[gy]\](.*)\[z\]\s+\^\-")
          m3u8_pattern = re.compile(r"(.+?)\s+(https?://.*\.m3u8.*)")

          for line in txt:
              line = line.strip()
              if not line:
                  continue

              header_match = header_pattern.match(line)
              if header_match:
                  current_time = header_match.group(1)
                  current_league = header_match.group(2).strip()
                  continue

              match = m3u8_pattern.match(line)
              if match:
                  match_name = match.group(1).strip()
                  url = match.group(2).strip()
                  output_lines.append(f"{current_league}#{current_time} {match_name}#{url}")

          output_file = "jadwal.txt"
          with open(output_file, "w", encoding="utf-8") as f:
              f.write("\n".join(output_lines) + "\n")

          print(f"Formatted {len(output_lines)} lines into {output_file}")
          EOF

      - name: Commit and Push Formatted TXT
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add jadwal.txt
          git commit -m "Update formatted .m3u8 blocks" || echo "No changes to commit"
          git push
