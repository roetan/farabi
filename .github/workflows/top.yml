name: Generate M3U Filter

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch source and filter M3U
        run: |
          URL="https://www.textise.net/showText.aspx?strURL=https%253A//aspaltvpasti.top/xxx/merah.php"

          echo "Fetching source..."
          curl -s "$URL" > topsource.txt

          echo "Filtering M3U content..."
          grep -Ei "m3u8?|\.m3u" topsource.txt | sort -u > top.m3u

          echo "Done. Output saved to top.m3u"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add top.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "update top.m3u (auto filter m3u)"
          git push
