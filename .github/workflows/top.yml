name: Markotop

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download and filter M3U content
      run: |
        # Download source dari URL
        curl -s https://linkqr.id/view-source?url=https%3A%2F%2Faspaltvpasti.top%2Fxxx%2Fmerah.php > source.html
        
        # Filter hanya baris yang berhubungan dengan kode M3U (.m3u, .m3u8, atau format playlist)
        python3 << 'EOF'
        import re
        
        # Baca source
        with open('source.html', 'r', encoding='utf-8', errors='ignore') as f:
            content = f.read()
        
        # Filter hanya yang berhubungan dengan M3U/M3U8
        m3u_lines = []
        lines = content.split('\n')
        
        for i, line in enumerate(lines):
            line = line.strip()
            # Ambil link M3U/M3U8 atau baris yang mengandung playlist format
            if (re.search(r'\.m3u(?:8?)(?:\?|$)', line, re.IGNORECASE) or 
                re.search(r'#EXTM3U', line, re.IGNORECASE) or
                re.search(r'#EXTINF', line, re.IGNORECASE)):
                m3u_lines.append(line)
        
        # Buat header M3U standar
        m3u_content = ['#EXTM3U url-tvg="https://iptv-org.github.io/iptv/index.m3u"']
        m3u_content.extend(m3u_lines)
        
        # Simpan ke file top.m3u
        with open('top.m3u', 'w', encoding='utf-8') as f:
            f.write('\n'.join(m3u_content) + '\n')
        
        print(f"Filtered {len(m3u_lines)} M3U-related lines")
        EOF

    - name: Check for changes
      id: verify-changed-files
      run: |
        if git diff --quiet top.m3u 2>/dev/null; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add top.m3u
        git commit -m "Update top.m3u from aspaltvpasti.top [$(date +'%Y-%m-%d %H:%M UTC')]"
        git push

    - name: No changes
      if: steps.verify-changed-files.outputs.changed == 'false'
      run: echo "No changes detected, skipping commit"
