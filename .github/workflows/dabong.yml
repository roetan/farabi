name: Processor

on:
  workflow_dispatch:

jobs:
  process-bongda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download bongda.m3u
        run: |
          curl -sSL https://raw.githubusercontent.com/t23-02/bongda/main/bongda.m3u -o dabong.txt

      - name: Process dabong.txt
        run: |
          awk '
          BEGIN {RS="\n#EXTINF"; ORS=""; FS="\n"}
          {
            # Tambahkan #EXTINF kembali jika bukan blok pertama
            block = (NR==1 ? $0 : "#EXTINF" $0)

            # Lewati block jika mengandung kata kunci tertentu
            if (block ~ /group-title="Bún chả"/) next
            if (block ~ /BIT.LY\/SOCOLIVE/) next
            if (block ~ /Tường thuật/) next

            # Ubah group-title menjadi uppercase
            gsub(/group-title="[^"]+"/, toupper("&"), block)

            # Ubah jam
            block = gensub(/([0-9]{1,2})[hH]([0-9]{2})/, "\\1:\\2 WIB", "g", block)

            # Hapus kata "ngày"
            gsub(/ngày[[:space:]]*/, "", block)

            # Hilangkan baris kosong
            n = split(block, lines, "\n")
            for (i=1; i<=n; i++) {
              if (lines[i] !~ /^$/) print lines[i] "\n"
            }
          }' dabong.txt > jadwal.m3u

      - name: Commit processed file
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add jadwal.m3u
          git commit -m "Update jadwal.m3u via workflow" || echo "No changes to commit"
          git push
