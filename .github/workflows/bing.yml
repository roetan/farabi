name: Binger

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download playlist and generate schedule2.txt
        run: |
          curl -L "https://raw.githubusercontent.com/srhady/bingstream/refs/heads/main/playlist.m3u" -o playlist.m3u

          python3 << 'EOF'
          import re

          disallowed_keywords = [
              "| Tarkam",
              "| Tarkul"
          ]

          blocked_strings = [
              'group-title="LIVE EVENT"',
              'https://github.com/srhady/Hady/raw/refs/heads/main/video_20260310_131739_edit.mp4',
              'tvg-logo="https://github.com/srhady/Hady/raw/refs/heads/main/1773124095740.png"'
          ]

          remove_prefixes = (
              "#name",
              "#telegram",
              "#owner",
              "#last update time"
          )

          with open("playlist.m3u", "r", encoding="utf-8", errors="ignore") as f:
              lines = [
                  line.strip()
                  for line in f
                  if not line.lower().startswith(remove_prefixes)
              ]

          output = []

          i = 0
          while i < len(lines):
              line = lines[i]

              if line.startswith("#EXTINF"):
                  block = [line]

                  j = i + 1
                  while j < len(lines):
                      block.append(lines[j])

                      if (
                          lines[j].startswith("http://")
                          or lines[j].startswith("https://")
                      ):
                          break

                      j += 1

                  block_text = "\n".join(block)

                  # Skip blocked blocks
                  if any(x in block_text for x in blocked_strings):
                      i = j + 1
                      continue

                  # Extract group-title
                  group_match = re.search(r'group-title="([^"]+)"', line)
                  if not group_match:
                      i = j + 1
                      continue

                  category = group_match.group(1).strip()

                  # Extract channel/event name
                  name_match = re.search(r'",\s*(.+)$', line)
                  if not name_match:
                      i = j + 1
                      continue

                  name = name_match.group(1).strip()

                  # Skip if channel/event name contains disallowed keyword
                  if any(keyword.lower() in name.lower() for keyword in disallowed_keywords):
                      i = j + 1
                      continue

                  # Extract URL
                  url = None
                  for b in block:
                      if b.startswith("http://") or b.startswith("https://"):
                          url = b.strip()
                          break

                  if url:
                      output.append(f"{category}#{name}#{url}")

                  i = j + 1
              else:
                  i += 1

          with open("schedule2.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")
          EOF

      - name: Commit and push schedule2.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schedule2.txt

          git commit --allow-empty -m "Update schedule2.txt $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"

          git push
