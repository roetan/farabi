name: Synchronizer

on:
  workflow_dispatch: 

jobs:
  sync-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      # --- FETCH SUMBER DENGAN TRANSFORMASI WAKTU ---
      
      - name: 2. Fetch HUGO dan Label WIB
        run: |
          # 1. Download file
          curl -sSL "https://raw.githubusercontent.com/t23-02/bongda/main/bongda.m3u" -o "bongda1.m3u" || echo "Gagal HUGO"
          
          # 2. Transformasi: Hapus zona waktu asing yang umum (ET, UK, GMT, dll.)
          # Menggunakan sintaks sed yang lebih aman
          sed -i 's/[ ]\(AM\|PM\)\?\s*\(ET\|MT\|UK\|GMT\|UTC\|CET\|BST\|CST\)\(\s*\|)\)//g' hugo.m3u
          
          # 3. Transformasi: Tambahkan label WIB setelah format jam (HH:MM)
          sed -i 's/\([0-9]\{1,2\}:[0-9]\{2\}\)/\1 WIB/g' hugo.m3u
          echo "✅ Waktu HUGO dilabeli WIB."

      - name: 2. Fetch NEIRA dan Label WIB
        run: |
          curl -sSL "https://raw.githubusercontent.com/felixiptv/FelixLive/main/PPVLand.m3u8" -o "neira.m3u" || echo "Gagal NEIRA"
          
          # Transformasi: Hapus zona waktu asing
          sed -i 's/[ ]\(AM\|PM\)\?\s*\(ET\|MT\|UK\|GMT\|UTC\|CET\|BST\|CST\)\(\s*\|)\)//g' neira.m3u
          
          # Transformasi: Tambahkan label WIB
          sed -i 's/\([0-9]\{1,2\}:[0-9]\{2\}\)/\1 WIB/g' neira.m3u
          echo "✅ Waktu NEIRA dilabeli WIB."
          
      # --- PENGGABUNGAN (MERGE) ---
      
      - name: 3. Merge Playlists
        run: |
          FINAL_OUTPUT="jadwal.m3u"
          
          # Buat Header Baru
          echo "#EXTM3U" > "$FINAL_OUTPUT"
          
          # Fungsi Penggabungan
          append_content() {
              FILENAME=$1
              NAME=$2
              if [ -f "$FILENAME" ]; then
                  echo -e "\n# --- $NAME ---" >> "$FINAL_OUTPUT"
                  tail -n +2 "$FILENAME" >> "$FINAL_OUTPUT"
                  echo "✅ $NAME berhasil digabung."
              else
                  echo "⚠️ File $FILENAME kosong/gagal, dilewati."
              fi
          }

          # Panggil file yang sudah didownload di atas
          append_content "hugo.m3u" "HUGO"
          append_content "neira.m3u" "NEIRA"

      - name: 7. Clean up Formatting
        run: |
          FINAL_OUTPUT="jadwal.m3u"
          # Hapus baris kosong
          sed -i '/^$/d' "$FINAL_OUTPUT"
          echo "✅ Format dibersihkan."

      # --- COMMIT PUSH (ACTION KHUSUS) ---
      - name: 8. Commit and Push Changes (Menggunakan Action Khusus)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          files: 'jadwal.m3u' 
          commit_message: 'Auto-Synced: Playlist Updated (WIB Labeled)'
          token: ${{ secrets.GITHUB_TOKEN }}
          push_options: '--force' 
          
