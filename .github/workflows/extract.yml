name: Extract

on:
  schedule:
    - cron: '0 * * * *' # setiap jam
  workflow_dispatch: # bisa dijalankan manual

jobs:
  extract-clean-blocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch TXT and Extract Clean Blocks
        run: |
          python - << 'EOF'
          import re
          import requests

          url = "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt"
          txt = requests.get(url).text

          # regex: header + baris pertandingan
          pattern = r"(\d{2}:\d{2} \[[gy]\].*?\[z\]\s+\^\-(?:\n[^\n]+ vs [^\n]+\s+(`F)?https?://[^\s]+)+)"

          blocks = re.findall(pattern, txt)

          with open("blocks_clean.txt", "w", encoding="utf-8") as f:
              for b in blocks:
                  f.write(b[0] + "\n\n")  # ambil grup pertama saja

          print(f"Extracted {len(blocks)} clean blocks into blocks_clean.txt")
          EOF

      - name: Commit and Push Clean Blocks
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add blocks_clean.txt
          git commit -m "Update extracted clean blocks" || echo "No changes to commit"
          git push
