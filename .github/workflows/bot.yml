name: Update Channels

on:
  schedule:
    - cron: '0 * * * *' # setiap 1 jam
  workflow_dispatch:

jobs:
  update-channels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Fetch and process channels
        run: |
          python - <<'EOF'
          import requests
          import os
          import sys

          url = "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt"
          output_file = "channels.txt"
          temp_file = "channels.tmp"

          try:
              response = requests.get(url, timeout=30)
              response.raise_for_status()
              content = response.text
          except Exception as e:
              print("Gagal fetch URL:", e)
              sys.exit(1)

          # parsing konten
          lines = content.splitlines()
          output_lines = []
          current_category = ""
          current_time = ""
          last_match_name = ""

          for line in lines:
              line = line.strip()
              if not line:
                  continue

              # kategori + waktu
              if line.endswith('^-'):
                  parts = line[:-2].split('\t')
                  if len(parts) >= 1:
                      time_and_category = parts[0].strip()
                      if ' ' in time_and_category:
                          current_time = time_and_category[:5]
                          current_category = time_and_category[6:].strip()
                      else:
                          current_category = time_and_category
                          current_time = ""
                  continue

              # nama pertandingan (bukan URL)
              if not line.startswith("http"):
                  last_match_name = line.lstrip('`F')
                  continue

              # URL HLS
              if ".m3u8" in line:
                  output_lines.append(f"{current_category}#{current_time} {last_match_name}#{line}")

          # tulis ke file sementara
          try:
              with open(temp_file, 'w', encoding='utf-8') as f:
                  f.write("\n".join(output_lines))
          except Exception as e:
              print("Gagal tulis file sementara:", e)
              sys.exit(1)

          # replace channels.txt
          os.replace(temp_file, output_file)

          print(f"{output_file} berhasil diperbarui, total {len(output_lines)} entries.")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add channels.txt
          git diff-index --quiet HEAD || git commit -m "Update channels.txt"
          git push
