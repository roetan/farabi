name: Extract Stream Blocks

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch & parse
        run: |
          curl -s "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt" -o data.txt

          awk '
          BEGIN {
              RS=""
              FS="\n"
          }

          {
              block = $0

              # WAJIB ada "vs"
              if (block !~ / vs /) next

              # WAJIB ada m3u8
              if (block !~ /m3u8/) next

              # ambil header jam + liga
              split(block, lines, "\n")
              header = lines[1]

              if (match(header, /[0-9]{2}:[0-9]{2}/)) {
                  time = substr(header, RSTART, RLENGTH)
              } else next

              gsub(/\[[^]]*\]/, "", header)
              gsub(/\^\-[a-zA-Z0-9]*/, "", header)

              sub(/^[0-9]{2}:[0-9]{2}[ \t]*/, "", header)
              league = header
              gsub(/^ +| +$/, "", league)

              # cari baris valid: harus vs + m3u8 + ada team
              for (i = 2; i <= length(lines); i++) {
                  line = lines[i]

                  if (line ~ / vs / && line ~ /m3u8/) {

                      # ambil game
                      if (match(line, /(.* vs .*?)\s/)) {
                          game = substr(line, RSTART, RLENGTH)
                          gsub(/[ \t]+$/, "", game)
                      } else {
                          next
                      }

                      # ambil URL m3u8 saja
                      if (match(line, /https?:\/\/[^ ]+\.m3u8[^ ]*/)) {
                          url = substr(line, RSTART, RLENGTH)
                      } else {
                          next
                      }

                      # filter tambahan: buang jika tidak ada "vs" di game valid
                      if (game !~ / vs /) next

                      print league "#" time " " game "#" url
                  }
              }
          }
          ' data.txt > source.txt

          echo "=== CLEAN OUTPUT ==="
          cat source.txt

      - name: Force commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add source.txt
          git commit --allow-empty -m "update source.txt $(date '+%H:%M:%S')"
          git push
