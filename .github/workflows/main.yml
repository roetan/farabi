name: Extract Stream Info

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and process data
        run: |
          curl -s "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt" -o data.txt

          awk '
          / vs / && /.m3u8/ {
              match($0, /[0-9]{2}:[0-9]{2}/)
              time = substr($0, RSTART, RLENGTH)

              rest = substr($0, RSTART + RLENGTH)

              gsub(/\[[^]]*\]/, "", rest)
              gsub(/\^\-/, "", rest)
              gsub(/^ +| +$/, "", rest)

              print time " | " rest
          }
          ' data.txt > source.txt

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add source.txt

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update source.txt"
            git push
          fi
