name: Extract Stream Info

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and process data
        run: |
          curl -s "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt" -o data.txt

          awk '
          / vs / && /.m3u8/ {
              line = $0

              # ambil jam
              if (match(line, /[0-9]{2}:[0-9]{2}/)) {
                  time = substr(line, RSTART, RLENGTH)
              } else {
                  next
              }

              # ambil URL
              if (match(line, /https?:\/\/[^ ]+\.m3u8[^ ]*/)) {
                  url = substr(line, RSTART, RLENGTH)
              } else {
                  next
              }

              # hapus URL dari line
              gsub(url, "", line)

              # ambil teks setelah jam
              sub(/^.*[0-9]{2}:[0-9]{2}/, "", line)
              rest = line

              # cleaning
              gsub(/\[[^]]*\]/, "", rest)
              gsub(/\^\-[a-zA-Z0-9]*/, "", rest)
              gsub(/^ +| +$/, "", rest)

              # split sebelum vs
              split(rest, tmp, " vs ")
              left = tmp[1]

              # ambil liga (semua sebelum 2 kata terakhir)
              n = split(left, words, " ")
              league = ""
              for (i = 1; i <= n-2; i++) {
                  league = league words[i]
                  if (i < n-2) league = league " "
              }

              print league "#" time " " rest "#" url
          }
          ' data.txt > source.txt

          echo "=== HASIL ==="
          cat source.txt

      - name: Force commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add source.txt
          git commit --allow-empty -m "Update source.txt $(date '+%Y-%m-%d %H:%M:%S')"
          git push
