name: Extract Stream Blocks

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # =========================
      # 1. FETCH SOURCE
      # =========================
      - name: Fetch source
        run: |
          curl -s "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt" -o data.txt

      # =========================
      # 2. HASH CHECK (only for source.txt)
      # =========================
      - name: Check content hash
        id: hash
        run: |
          NEW_HASH=$(sha256sum data.txt | awk '{print $1}')
          echo "new_hash=$NEW_HASH" >> $GITHUB_OUTPUT

          if [ -f last_hash.txt ]; then
            OLD_HASH=$(cat last_hash.txt)
          else
            OLD_HASH=""
          fi

          if [ "$NEW_HASH" = "$OLD_HASH" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

          echo $NEW_HASH > last_hash.txt

      # =========================
      # 3. PROCESS → source.txt (ONLY IF CHANGED)
      # =========================
      - name: Generate schedule.txt
        run: |
          awk -F'#' '
          {
              league = $1
              game   = $2
              url    = $3

              # skip kalau kosong
              if (league == "" || game == "" || url == "") next

              # normalize TAB → SPACE
              gsub(/\t/, " ", league)
              gsub(/\t/, " ", game)
              gsub(/\t/, " ", url)

              # HARD TRIM (hapus spasi depan & belakang)
              gsub(/^ +| +$/, "", league)
              gsub(/^ +| +$/, "", game)
              gsub(/^ +| +$/, "", url)

              # hapus spasi ganda di dalam string
              gsub(/  +/, " ", league)
              gsub(/  +/, " ", game)

              # rebuild format CLEAN (tanpa space di sekitar #)
              print league "#" game "#" url
          }
          ' source.txt > schedule.txt

          echo "=== CLEAN schedule.txt ==="
          cat schedule.txt

      # =========================
      # 4. ALWAYS GENERATE schedule.txt
      # =========================
      - name: Generate schedule.txt
        run: |
          # selalu pastikan file ada
          if [ ! -f source.txt ]; then
            echo "source.txt not found, skipping"
            touch source.txt
          fi

          awk -F'#' '
          {
              league = $1
              game   = $2
              url    = $3

              # skip kosong
              if (league == "" || game == "" || url == "") next

              # trim spasi
              gsub(/^ +| +$/, "", league)
              gsub(/^ +| +$/, "", game)
              gsub(/^ +| +$/, "", url)

              print league "#" game "#" url
          }
          ' source.txt > schedule.txt

          echo "=== schedule.txt ==="
          cat schedule.txt

      # =========================
      # 5. COMMIT (ALWAYS schedule.txt, conditional source.txt)
      # =========================
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add schedule.txt last_hash.txt

          # source.txt hanya kalau berubah
          if [ "${{ steps.hash.outputs.changed }}" = "true" ]; then
            git add source.txt
          fi

          git commit -m "update schedule (always) + source (if changed)" || echo "no changes"

          git push
