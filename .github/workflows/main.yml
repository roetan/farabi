name: Extract Stream Blocks

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch & parse
        run: |
          curl -s "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt" -o data.txt

          awk '
          BEGIN {
              FS="\n"
              RS=""
          }

          {
              block = $0

              # ambil jam + liga dari baris pertama
              if (match(block, /[0-9]{2}:[0-9]{2}/)) {
                  time = substr(block, RSTART, RLENGTH)
              } else next

              # ambil liga (baris pertama sebelum ^-)
              split(block, lines, "\n")
              header = lines[1]

              gsub(/\[[^]]*\]/, "", header)
              gsub(/\^\-[a-zA-Z0-9]*/, "", header)

              match(header, /^[0-9]{2}:[0-9]{2} (.*)/, m)
              league = m[1]
              gsub(/^[ \t]+|[ \t]+$/, "", league)

              # proses line match + url
              for (i = 2; i <= length(lines); i++) {
                  line = lines[i]

                  if (line ~ /vs/ && line ~ /m3u8/) {

                      # ambil match
                      match(line, /(.* vs .*?)\s/)
                      game = substr(line, RSTART, RLENGTH)
                      gsub(/[ \t]+$/, "", game)

                      # ambil url m3u8
                      if (match(line, /https?:\/\/[^ ]+\.m3u8[^ ]*/)) {
                          url = substr(line, RSTART, RLENGTH)
                      } else {
                          continue
                      }

                      # output
                      print league "#" time " " game "#" url
                  }
              }
          }
          ' data.txt > source.txt

          echo "=== OUTPUT ==="
          cat source.txt

      - name: Force commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add source.txt
          git commit --allow-empty -m "update source.txt $(date '+%H:%M:%S')"
          git push
