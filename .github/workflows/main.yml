name: Extract Stream Blocks

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # =========================
      # 1. FETCH SOURCE
      # =========================
      - name: Fetch source
        run: |
          curl -s "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt" -o data.txt

      # =========================
      # 2. HASH CHECK
      # =========================
      - name: Check content hash
        id: hash
        run: |
          NEW_HASH=$(sha256sum data.txt | awk '{print $1}')
          echo "new_hash=$NEW_HASH" >> $GITHUB_OUTPUT

          if [ -f last_hash.txt ]; then
            OLD_HASH=$(cat last_hash.txt)
          else
            OLD_HASH=""
          fi

          if [ "$NEW_HASH" = "$OLD_HASH" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

          echo $NEW_HASH > last_hash.txt

      # =========================
      # 3. PROCESS SOURCE → source.txt
      # =========================
      - name: Process data
        if: steps.hash.outputs.changed == 'true'
        run: |
          awk '
          BEGIN { RS=""; FS="\n" }

          {
              block = $0

              if (block !~ / vs /) next
              if (block !~ /m3u8/) next

              split(block, lines, "\n")
              header = lines[1]

              if (match(header, /[0-9]{2}:[0-9]{2}/)) {
                  time = substr(header, RSTART, RLENGTH)
              } else next

              gsub(/\[[^]]*\]/, "", header)
              gsub(/\^\-[a-zA-Z0-9]*/, "", header)

              sub(/^[0-9]{2}:[0-9]{2}[ \t]*/, "", header)
              league = header
              gsub(/^ +| +$/, "", league)

              for (i = 2; i <= length(lines); i++) {
                  line = lines[i]

                  if (line ~ / vs / && line ~ /m3u8/) {

                      if (match(line, /(.* vs .*?)\s/)) {
                          game = substr(line, RSTART, RLENGTH)
                          gsub(/[ \t]+$/, "", game)
                      } else next

                      if (match(line, /https?:\/\/[^ ]+\.m3u8[^ ]*/)) {
                          url = substr(line, RSTART, RLENGTH)
                      } else next

                      print league "#" time " " game "#" url
                  }
              }
          }
          ' data.txt > source.txt

          echo "=== source.txt ==="
          cat source.txt

      # =========================
      # 4. GENERATE schedule.txt
      # =========================
      - name: Generate schedule.txt
        if: steps.hash.outputs.changed == 'true'
        run: |
          awk -F'#' '
          {
              league = $1
              match  = $2
              url    = $3

              if (league == "" || match == "" || url == "") next

              gsub(/^ +| +$/, "", league)
              gsub(/^ +| +$/, "", match)
              gsub(/^ +| +$/, "", url)

              print league "#" match "#" url
          }
          ' source.txt > schedule.txt

          echo "=== schedule.txt ==="
          cat schedule.txt

      # =========================
      # 5. COMMIT ALL
      # =========================
      - name: Commit changes
        if: steps.hash.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add source.txt schedule.txt last_hash.txt

          git commit -m "update source & schedule (content changed)"
          git push
