name: Extract Stream Info

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch and process data
        run: |
          curl -s "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt" -o data.txt

          echo "=== HASIL ==="

          awk '
          / vs / && /.m3u8/ {
              # ambil jam HH:mm
              match($0, /[0-9]{2}:[0-9]{2}/)
              time = substr($0, RSTART, RLENGTH)

              # ambil sisa setelah jam
              rest = substr($0, RSTART + RLENGTH)

              # hapus [....]
              gsub(/\[[^]]*\]/, "", rest)

              # hapus ^-
              gsub(/\^\-/, "", rest)

              # trim spasi
              gsub(/^ +| +$/, "", rest)

              print time " | " rest
          }
          ' data.txt
