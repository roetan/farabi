name: Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-pipeline]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

# =========================
# 1. SETUP
# =========================
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests


# =========================
# 2. FETCH ONCE ONLY (SOURCE)
# =========================
      - name: Fetch source only once
        run: |
          python - << 'EOF'
          import requests

          url = "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt"
          txt = requests.get(url).text

          with open("source.txt", "w", encoding="utf-8") as f:
              f.write(txt)

          print("SOURCE SAVED")
          EOF


# =========================
# 3. EXTRACT CLEAN BLOCKS (langsung format final)
# =========================
      - name: Extract Clean Blocks
        run: |
          python - << 'EOF'
          import re

          with open("source.txt","r",encoding="utf-8") as f:
              txt = f.read()

          # Regex untuk header: jam + kode + kategori
          header_pattern = re.compile(r"\d{2}:\d{2} \[[a-z0-9]\](.*?)\[z\]")

          # Regex untuk pertandingan + URL .m3u8
          url_pattern = re.compile(r"([^\n]+ vs [^\n]+)\s+(https?://[^\s]+\.m3u8[^\s]*)")

          blocks = []

          # Iterasi semua header
          headers = list(header_pattern.finditer(txt))
          for i, header in enumerate(headers):
              start = header.end()
              end = headers[i + 1].start() if i + 1 < len(headers) else len(txt)
              block_text = txt[start:end]

              # Cari semua pertandingan + URL dalam blok
              matches = url_pattern.findall(block_text)
              for match in matches:
                  # Format: kategori#pertandingan#url
                  match_line = f"{header.group(1).strip()}#{match[0].strip()}#{match[1].strip()}"
                  blocks.append(match_line)

          # Tulis langsung ke file schedule.txt
          with open("schedule.txt","w",encoding="utf-8") as f:
              for b in blocks:
                  f.write(b + "\n")

          print("EXTRACT DONE:", len(blocks))
          EOF


# =========================
# 4. COMMIT OUTPUT
# =========================
      - name: Commit results
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add schedule.txt source.txt
          git commit -m "Pipeline update (clean .m3u8 schedule)" || echo "No changes"
          git push
