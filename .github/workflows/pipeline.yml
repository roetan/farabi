name: Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-data]

jobs:

# =========================
# STEP 1 - EXTRACT (FRESH SOURCE)
# =========================
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Fetch source (anti cache)
        run: |
          python - << 'EOF'
          import requests, time

          url = "https://raw.githubusercontent.com/englishcd/ai/main/a0a.txt?ts=" + str(int(time.time()))

          headers = {
              "Cache-Control": "no-cache",
              "Pragma": "no-cache"
          }

          txt = requests.get(url, headers=headers, timeout=30).text

          with open("raw.txt","w",encoding="utf-8") as f:
              f.write(txt)

          print("RAW SAVED")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: raw
          path: raw.txt


# =========================
# STEP 2 - FILTER (KEEP STRUCTURE)
# =========================
  filter:
    needs: extract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: raw

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Filter valid lines only
        run: |
          python - << 'EOF'
          import re
          import html

          txt = open("raw.txt","r",encoding="utf-8").read().splitlines()

          url_pattern = re.compile(r"https?://\S+")

          cleaned = []

          for line in txt:
              line = html.unescape(line.strip())
              if not line:
                  continue

              # buang noise total
              if "`F" in line or "`0" in line:
                  continue

              # hanya simpan line yang punya URL
              if url_pattern.search(line):
                  cleaned.append(line)
              else:
                  cleaned.append(line)  # tetap simpan header

          with open("filtered.txt","w",encoding="utf-8") as f:
              f.write("\n".join(cleaned) + "\n")

          print("FILTER DONE:", len(cleaned))
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: filtered
          path: filtered.txt


# =========================
# STEP 3 - FORMAT FINAL (CATEGORY SAFE)
# =========================
  format:
    needs: filter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: filtered

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Build final jadwal
        run: |
          python - << 'EOF'
          import re
          import html

          txt = open("filtered.txt","r",encoding="utf-8").read().splitlines()

          header_pattern = re.compile(r"(\d{2}:\d{2}) \[[gy]\](.*)\[z\]\s+\^\-")
          url_pattern = re.compile(r"https?://\S+")

          output = []
          current_time = ""
          current_league = ""

          for line in txt:
              line = html.unescape(line.strip())

              if not line:
                  continue

              # HEADER (kategori + jam)
              h = header_pattern.match(line)
              if h:
                  current_time = h.group(1)
                  current_league = h.group(2).strip()
                  continue

              urls = url_pattern.findall(line)

              for url in urls:

                  # FILTER FINAL
                  if ".m3u8" not in url:
                      continue
                  if "`F" in line or "`0" in line:
                      continue

                  name = line.split(url)[0]
                  name = name.replace("`F","").replace("`0","").strip()

                  if current_league and current_time:
                      output.append(f"{current_league}#{current_time} {name}#{url}")

          with open("schedule.txt","w",encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")

          print("FINAL OUTPUT:", len(output))
          EOF

      - name: Commit final result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add schedule.txt
          git commit -m "Update stable IPTV jadwal" || echo "No changes"
          git push
