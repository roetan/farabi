name: Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-pipeline]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

# =========================
# STEP 1 - SETUP
# =========================
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests


# =========================
# STEP 2 - EXTRACT
# =========================
      - name: Fetch TXT and Extract Clean Blocks
        run: |
          python - << 'EOF'
          import re
          import requests

          url = "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt"
          txt = requests.get(url).text

          pattern = r"(\d{2}:\d{2} \[[gy]\].*?\[z\]\s+\^\-(?:\n[^\n]+ vs [^\n]+\s+(`F)?https?://[^\s]+)+)"

          blocks = re.findall(pattern, txt)

          with open("blocks_clean.txt", "w", encoding="utf-8") as f:
              for b in blocks:
                  f.write(b[0] + "\n\n")

          print("EXTRACT DONE:", len(blocks))
          EOF


# =========================
# STEP 3 - FILTER
# =========================
      - name: Filter URLs
        run: |
          python - << 'EOF'
          import requests
          import re

          url = "https://raw.githubusercontent.com/roetan/farabi/refs/heads/main/blocks_clean.txt"
          response = requests.get(url)
          lines = response.text.splitlines()

          url_pattern = re.compile(r"https?://\S+")

          filtered = []
          for line in lines:
              if url_pattern.search(line) and ".m3u8" not in line:
                  continue
              filtered.append(line)

          with open("blocks_m3u8_filtered.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(filtered))

          print("FILTER DONE")
          EOF


# =========================
# STEP 4 - FORMAT FINAL
# =========================
      - name: Format output
        run: |
          python - << 'EOF'
          import re
          import requests

          url = "https://raw.githubusercontent.com/roetan/farabi/refs/heads/main/blocks_m3u8_filtered.txt"
          txt = requests.get(url).text.splitlines()

          output_lines = []
          current_time = ""
          current_league = ""

          header_pattern = re.compile(r"(\d{2}:\d{2}) \[[gy]\](.*)\[z\]\s+\^\-")
          m3u8_pattern = re.compile(r"(.+?)\s+(https?://.*\.m3u8.*)")

          for line in txt:
              line = line.strip()
              if not line:
                  continue

              header_match = header_pattern.match(line)
              if header_match:
                  current_time = header_match.group(1)
                  current_league = header_match.group(2).strip()
                  continue

              match = m3u8_pattern.match(line)
              if match:
                  match_name = match.group(1).strip()
                  url = match.group(2).strip()
                  output_lines.append(f"{current_league}#{current_time} {match_name}#{url}")

          with open("schedule.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(output_lines))

          print("FORMAT DONE:", len(output_lines))
          EOF


# =========================
# STEP 5 - COMMIT RESULT
# =========================
      - name: Commit output
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add schedule.txt blocks_clean.txt blocks_m3u8_filtered.txt
          git commit -m "Update pipeline output" || echo "No changes"
          git push
