name: Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-pipeline]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

# =========================
# 1. SETUP
# =========================
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests


# =========================
# 2. FETCH ONCE ONLY (SOURCE)
# =========================
      - name: Fetch source only once (forced refresh)
        run: |
          python - << 'EOF'
          import requests
          import time
          import re

          url = "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt"
 
          headers = {
            "Cache-Control": "no-cache",
            "Pragma": "no-cache"
          }

          txt = requests.get(url, headers=headers).text

          # FORCE DIFFERENCE MARKER (biar selalu dianggap file baru)
          txt = f"<!-- RUN {time.time()} -->\n" + txt

          # =========================
          # FILTER BLOK VALID
          # =========================
          # kategori yang mau diambil
          valid_categories = [
            "Argentine Division 1",
            "Danish Superliga",
            "English Premier League",
            "Finnish Super League",
            "Italian Serie A",
            "Portuguese Primera Liga",
            "Saudi Professional League",
            "Scottish Premiership",
            "Spanish La Liga",
            "Super League",
            "Sweden Allsvenskan"
          ]

          # pisahkan per baris
          lines = [l.strip() for l in txt.splitlines() if l.strip()]
          valid_lines = []
          current_header = None

          header_pattern = re.compile(r"(\d{2}:\d{2})\s+(.*)")

          for line in lines:
            h = header_pattern.match(line)
            if h:
                jam = h.group(1)
                kategori = h.group(2).strip()
                # cek apakah kategori valid
                if any(k in kategori.lower() for k in valid_categories):
                    current_header = (jam, kategori)
                    valid_lines.append(line)  # simpan header
                else:
                    current_header = None
            else:
                # hanya simpan jika ada header valid sebelumnya
                if current_header:
                    valid_lines.append(line)

          # tulis kembali ke source.txt
          with open("source.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(valid_lines) + "\n")

          print(f"SOURCE FORCED REFRESHED + FILTERED BLOCKS ({len(valid_lines)} lines)")
          EOF


# =========================
# 4. COMMIT OUTPUT
# =========================
      - name: Commit results (only if changed)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add schedule.txt source.txt

          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Pipeline update (clean .m3u8 schedule)"
            git push
          fi
