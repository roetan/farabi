name: Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-pipeline]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

# =========================
# 1. SETUP
# =========================
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests


# =========================
# 2. FETCH ONCE ONLY (SOURCE)
# =========================
      - name: Fetch source only once
        run: |
          python - << 'EOF'
          import requests

          url = "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt"
          txt = requests.get(url).text

          with open("source.txt", "w", encoding="utf-8") as f:
              f.write(txt)

          print("SOURCE SAVED")
          EOF


# =========================
# 3. EXTRACT (LOCAL ONLY)
# =========================
      - name: Extract Clean Blocks
        run: |
          python - << 'EOF'
          import re

          with open("source.txt","r",encoding="utf-8") as f:
              txt = f.read()

          pattern = r"(\d{2}:\d{2} \[[a-z0-9]\].*?\[z\]\s+\^-.*?(?:\n[^\n]+ vs [^\n]+\s+(`F)?https?://[^\s]+)+)"
          blocks = re.findall(pattern, txt)

          with open("blocks_clean.txt","w",encoding="utf-8") as f:
              for b in blocks:
                  f.write(b[0] + "\n\n")

          print("EXTRACT DONE:", len(blocks))
          EOF


# =========================
# 4. FILTER (LOCAL ONLY)
# =========================
      - name: Filter m3u8 only
        run: |
          python - << 'EOF'
          import re

          with open("blocks_clean.txt","r",encoding="utf-8") as f:
              lines = f.read().splitlines()

          url_pattern = re.compile(r"https?://\S+")

          filtered = []
          for line in lines:
              if url_pattern.search(line) and ".m3u8" not in line:
                  continue
              filtered.append(line)

          with open("blocks_m3u8_filtered.txt","w",encoding="utf-8") as f:
              f.write("\n".join(filtered))

          print("FILTER DONE")
          EOF


# =========================
# 5. FORMAT FINAL (LOCAL ONLY)
# =========================
      - name: Format jadwal
        run: |
          python - << 'EOF'
          import re

          with open("blocks_m3u8_filtered.txt","r",encoding="utf-8") as f:
              txt = f.read().splitlines()

          output = []
          current_time = ""
          current_league = ""

          header_pattern = re.compile(r"(\d{2}:\d{2}) \[[gy]\](.*)\[z\]\s+\^\-")
          m3u8_pattern = re.compile(r"(.+?)\s+(https?://.*\.m3u8.*)")

          for line in txt:
              line = line.strip()
              if not line:
                  continue

              header = header_pattern.match(line)
              if header:
                  current_time = header.group(1)
                  current_league = header.group(2).strip()
                  continue

              match = m3u8_pattern.match(line)
              if match:
                  name = match.group(1).strip()
                  url = match.group(2).strip()
                  output.append(f"{current_league}#{current_time} {name}#{url}")

          with open("schedule.txt","w",encoding="utf-8") as f:
              f.write("\n".join(output))

          print("FORMAT DONE:", len(output))
          EOF


# =========================
# 6. COMMIT OUTPUT
# =========================
      - name: Commit results
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add schedule.txt blocks_clean.txt blocks_m3u8_filtered.txt source.txt
          git commit -m "Pipeline update (zero HTTP internal)" || echo "No changes"
          git push
