name: Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-data]

jobs:

# =========================
# STEP 1 - EXTRACT (FRESH DATA)
# =========================
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Fetch source (anti cache)
        run: |
          python - << 'EOF'
          import requests, time

          url = "https://raw.githubusercontent.com/englishcd/ai/main/a0a.txt?ts=" + str(int(time.time()))

          headers = {
              "Cache-Control": "no-cache",
              "Pragma": "no-cache"
          }

          txt = requests.get(url, headers=headers, timeout=30).text

          import re

          pattern = r"(\d{2}:\d{2} \[[gy]\].*?\[z\]\s+\^\-(?:\n[^\n]+ vs [^\n]+\s+(`F)?https?://[^\s]+)+)"
          blocks = re.findall(pattern, txt)

          with open("blocks_clean.txt", "w", encoding="utf-8") as f:
              for b in blocks:
                  f.write(b[0] + "\n\n")

          print("EXTRACT:", len(blocks))
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: step1
          path: blocks_clean.txt


# =========================
# STEP 2 - FILTER (ONLY M3U8)
# =========================
  filter:
    needs: extract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: step1

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Filter valid m3u8
        run: |
          python - << 'EOF'
          import re

          with open("blocks_clean.txt","r",encoding="utf-8") as f:
              lines = f.read().splitlines()

          url_pattern = re.compile(r"https?://\S+")

          filtered = []
          for line in lines:
              if not line.strip():
                  continue

              urls = url_pattern.findall(line)
              if not urls:
                  continue

              for url in urls:

                  # ❌ skip non m3u8
                  if ".m3u8" not in url:
                      continue

                  # ❌ skip noise prefix
                  if "`F" in line or "`0" in line:
                      continue

                  filtered.append(line)

          with open("blocks_m3u8.txt","w",encoding="utf-8") as f:
              f.write("\n".join(filtered) + "\n")

          print("FILTER DONE:", len(filtered))
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: step2
          path: blocks_m3u8.txt


# =========================
# STEP 3 - FORMAT + COMMIT FINAL
# =========================
  format:
    needs: filter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: step2

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Build jadwal final
        run: |
          python - << 'EOF'
          import re
          import html

          txt = open("blocks_m3u8.txt","r",encoding="utf-8").read().splitlines()

          header_pattern = re.compile(r"(\d{2}:\d{2}) \[[gy]\](.*)\[z\]\s+\^\-")
          url_pattern = re.compile(r"https?://\S+")

          output = []
          current_time = ""
          current_league = ""

          for line in txt:
              line = html.unescape(line.strip())

              if not line:
                  continue

              h = header_pattern.match(line)
              if h:
                  current_time = h.group(1)
                  current_league = h.group(2).strip()
                  continue

              urls = url_pattern.findall(line)

              for url in urls:

                  # ❌ final safety filter
                  if ".m3u8" not in url:
                      continue
                  if "`F" in line or "`0" in line:
                      continue

                  name = line.split(url)[0]
                  name = name.replace("`F","").replace("`0","").strip()

                  output.append(f"{current_league}#{current_time} {name}#{url}")

          with open("schedule.txt","w",encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")

          print("FINAL OUTPUT:", len(output))
          EOF

      - name: Commit result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add schedule.txt
          git commit -m "Update stable jadwal" || echo "No changes"
          git push
