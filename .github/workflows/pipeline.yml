name: Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-pipeline]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

# =========================
# 1. SETUP
# =========================
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests


# =========================
# 2. FETCH ONCE ONLY (SOURCE)
# =========================
      - name: Fetch source only once (forced refresh)
        run: |
          python - << 'EOF'
          import requests
          import time

          url = "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt"

          headers = {
              "Cache-Control": "no-cache",
              "Pragma": "no-cache"
          }

          txt = requests.get(url, headers=headers).text

          # FORCE DIFFERENCE MARKER (biar selalu dianggap file baru)
          txt = f"<!-- RUN {time.time()} -->\n" + txt

          with open("source.txt", "w", encoding="utf-8") as f:
              f.write(txt)

          print("SOURCE FORCED REFRESHED")
          EOF


# =========================
# 3. EXTRACT CLEAN BLOCKS
# =========================
      - name: Extract Clean Blocks
        run: |
          python - << 'EOF'
          import re

          with open("source.txt","r",encoding="utf-8") as f:
              txt = f.read()

          lines = txt.splitlines()

          blocks = []

          # header sekarang: 15:30 Super League
          header_pattern = re.compile(r"(\d{2}:\d{2})\s+(.*)")

          # ambil hanya m3u8 valid
          url_pattern = re.compile(r"https?://\S+\.m3u8\S*")

          current_time = None
          current_category = None

          for i in range(len(lines)):
              line = lines[i].strip()

              # deteksi header
              h = header_pattern.match(line)
              if h:
                  current_time = h.group(1).strip()
                  current_category = h.group(2).strip()
                  continue

              # deteksi match line
              if "vs" in line and current_time and current_category:
                  match_name = line.split("\t")[0].strip()

                  # cari URL di baris ini
                  urls = url_pattern.findall(line)

                  # kalau tidak ada, cek baris berikutnya
                  if not urls and i + 1 < len(lines):
                      urls = url_pattern.findall(lines[i + 1])

                  if urls:
                      blocks.append(
                          f"{current_category}#{current_time} {match_name}#{urls[0]}"
                      )

          with open("schedule.txt","w",encoding="utf-8") as f:
              f.write("\n".join(blocks) + "\n")

          print("EXTRACT DONE:", len(blocks))
          EOF


# =========================
# 4. COMMIT OUTPUT
# =========================
      - name: Commit results (only if changed)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add schedule.txt source.txt

          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Pipeline update (clean .m3u8 schedule)"
            git push
          fi
