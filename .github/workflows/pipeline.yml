name: Pipeline Extract → Filter → Format

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-data]

jobs:

# =========================
# STEP 1 - EXTRACT
# =========================
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Extract Clean Blocks
        run: |
          python - << 'EOF'
          import re
          import requests

          url = "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt"
          txt = requests.get(url).text

          pattern = r"(\d{2}:\d{2} \[[gy]\].*?\[z\]\s+\^\-(?:\n[^\n]+ vs [^\n]+\s+(`F)?https?://[^\s]+)+)"

          blocks = re.findall(pattern, txt)

          with open("blocks_clean.txt", "w", encoding="utf-8") as f:
              for b in blocks:
                  f.write(b[0] + "\n\n")

          print(f"Extracted {len(blocks)} blocks")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: step1
          path: blocks_clean.txt


# =========================
# STEP 2 - FILTER
# =========================
  filter:
    needs: extract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: step1

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Filter M3U8
        run: |
          python - << 'EOF'
          import re

          with open("blocks_clean.txt","r",encoding="utf-8") as f:
              lines = f.read().splitlines()

          url_pattern = re.compile(r"https?://\S+")

          filtered = []
          for line in lines:
              if url_pattern.search(line) and ".m3u8" not in line:
                  continue
              filtered.append(line)

          with open("blocks_m3u8_filtered.txt","w",encoding="utf-8") as f:
              f.write("\n".join(filtered) + "\n")

          print("Filter done")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: step2
          path: blocks_m3u8_filtered.txt


# =========================
# STEP 3 - FORMAT + COMMIT (FIXED)
# =========================
  format:
    needs: filter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (WAJIB untuk git push)
        uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: step2

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Format jadwal final
        run: |
          python - << 'EOF'
          import re

          txt = open("blocks_m3u8_filtered.txt","r",encoding="utf-8").read().splitlines()

          header_pattern = re.compile(r"(\d{2}:\d{2}) \[[gy]\](.*)\[z\]\s+\^\-")
          m3u8_pattern = re.compile(r"(.+?)\s+(https?://.*\.m3u8.*)")

          output = []
          current_time = ""
          current_league = ""

          for line in txt:
              line = line.strip()
              if not line:
                  continue

              h = header_pattern.match(line)
              if h:
                  current_time = h.group(1)
                  current_league = h.group(2).strip()
                  continue

              m = m3u8_pattern.match(line)
              if m:
                  name = m.group(1).strip()
                  url = m.group(2).strip()
                  output.append(f"{current_league}#{current_time} {name}#{url}")

          with open("jadwal.txt","w",encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")

          print(f"Final lines: {len(output)}")
          EOF

      - name: Commit and push result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add jadwal.txt
          git commit -m "Update jadwal final" || echo "No changes"
          git push
