name: Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-pipeline]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

# =========================
# 1. SETUP
# =========================
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests


# =========================
# 2. FETCH ONCE ONLY (SOURCE)
# =========================
      - name: Fetch source only once (forced refresh)
        run: |
          python - << 'EOF'
          import requests
          import time

          url = "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt"

          headers = {
              "Cache-Control": "no-cache",
              "Pragma": "no-cache"
          }

          txt = requests.get(url, headers=headers).text

          # FORCE DIFFERENCE MARKER (biar selalu dianggap file baru)
          txt = f"<!-- RUN {time.time()} -->\n" + txt

          with open("source.txt", "w", encoding="utf-8") as f:
              f.write(txt)

          print("SOURCE FORCED REFRESHED")
          EOF


# =========================
# 3. EXTRACT CLEAN BLOCKS
# =========================
      - name: Extract Clean Blocks
        run: |
          python - << 'EOF'
          import re

          with open("source.txt","r",encoding="utf-8") as f:
              lines = [l.strip() for l in f if l.strip()]

          header_pattern = re.compile(r"\[(.*?)\]\s*(.*?)\s*\[z\]|(.*?)\s*\[z\]|(.*?)")

          url_pattern = re.compile(r"https?://\S+\.m3u8\S*")

          blocks = []
          seen = set()

          current_category = None
          current_time = None

          for i, line in enumerate(lines):

              # =========================
              # CLEAN HEADER
              # =========================
              if ":" in line and "vs" not in line:
                  # contoh:
                  # Super League ^-
                  # [y]English Premier League[z] ^-

                  line_clean = line.replace("^-", "").strip()

                  # hapus tag [y] [g] dll
                  line_clean = re.sub(r"\[[a-z]\]", "", line_clean)
                  line_clean = line_clean.replace("[z]", "").strip()

                  parts = line_clean.split()

                  # ambil jam jika ada
                  time_match = re.search(r"(\d{2}:\d{2})", line_clean)
                  if time_match:
                      current_time = time_match.group(1)

                  # kategori = sisa teks tanpa jam
                  current_category = re.sub(r"\d{2}:\d{2}", "", line_clean).strip()

                  continue

              # =========================
              # MATCH LINE
              # =========================
              if "vs" in line and current_category and current_time:

                  match_name = line.split("\t")[0].strip()

                  urls = url_pattern.findall(line)

                  if not urls and i + 1 < len(lines):
                      urls = url_pattern.findall(lines[i + 1])

                  if urls:
                      url = urls[-1]  # ambil yang paling valid

                      key = f"{current_category}#{current_time} {match_name}#{url}"

                      if key not in seen:
                          seen.add(key)
                          blocks.append(key)

          with open("schedule.txt","w",encoding="utf-8") as f:
              f.write("\n".join(blocks) + "\n")

          print("EXTRACT DONE:", len(blocks))
          EOF


# =========================
# 4. COMMIT OUTPUT
# =========================
      - name: Commit results (only if changed)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add schedule.txt source.txt

          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Pipeline update (clean .m3u8 schedule)"
            git push
          fi
