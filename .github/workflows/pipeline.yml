name: Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-pipeline]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

# =========================
# 1. SETUP
# =========================
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests


# =========================
# 2. FETCH ONCE ONLY (SOURCE)
# =========================
      - name: Fetch source only once (forced refresh)
        run: |
          python - << 'EOF'
          import requests
          import time

          url = "https://raw.githubusercontent.com/englishcd/ai/refs/heads/main/a0a.txt"

          headers = {
              "Cache-Control": "no-cache",
              "Pragma": "no-cache"
          }

          txt = requests.get(url, headers=headers).text

          # FORCE DIFFERENCE MARKER (biar selalu dianggap file baru)
          txt = f"<!-- RUN {time.time()} -->\n" + txt

          with open("source.txt", "w", encoding="utf-8") as f:
              f.write(txt)

          print("SOURCE FORCED REFRESHED")
          EOF


# =========================
# 3. EXTRACT CLEAN BLOCKS
# =========================
      - name: Extract Clean Blocks
        run: |
          python - << 'EOF'
          import re
          import time

          with open("source.txt","r",encoding="utf-8") as f:
              txt = f.read()

          # HEADER lebih fleksibel (tidak tergantung [a-z0-9] saja)
          header_pattern = re.compile(r"(\d{2}:\d{2})\s*\[(.*?)\](.*?)\[z\]")

          # MATCH lebih tahan variasi spasi & format URL
          url_pattern = re.compile(r"(.+?vs.+?)\s+(https?://\S+?\.m3u8\S*)")

          blocks = []
          headers = list(header_pattern.finditer(txt))

          for i, header in enumerate(headers):
              jam = header.group(1).strip()
              kategori = header.group(2).strip()

              start = header.end()
              end = headers[i + 1].start() if i + 1 < len(headers) else len(txt)

              block_text = txt[start:end]
              matches = url_pattern.findall(block_text)

              for match in matches:
                  match_line = f"{kategori}#{jam} {match[0].strip()}#{match[1].strip()}"
                  blocks.append(match_line)

          # FORCE OUTPUT SELALU BERUBAH
          run_id = int(time.time())
          blocks.append(f"#RUN {run_id}")

          with open("schedule.txt","w",encoding="utf-8") as f:
              f.write("\n".join(blocks) + "\n")

          print("EXTRACT DONE:", len(blocks))
          EOF


# =========================
# 4. COMMIT OUTPUT
# =========================
      - name: Commit results (only if changed)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add schedule.txt source.txt

          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Pipeline update (clean .m3u8 schedule)"
            git push
          fi
