name: Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-data]

jobs:

# =========================
# STEP 1 - EXTRACT RAW (FRESH)
# =========================
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Fetch source (anti cache)
        run: |
          python - << 'EOF'
          import requests, time

          url = "https://raw.githubusercontent.com/englishcd/ai/main/a0a.txt?ts=" + str(int(time.time()))

          headers = {
              "Cache-Control": "no-cache",
              "Pragma": "no-cache"
          }

          txt = requests.get(url, headers=headers, timeout=30).text

          with open("raw.txt","w",encoding="utf-8") as f:
              f.write(txt)

          print("RAW OK")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: raw
          path: raw.txt


# =========================
# STEP 2 - FILTER ONLY VALID BLOCKS
# =========================
  filter:
    needs: extract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: raw

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Keep only structured blocks
        run: |
          python - << 'EOF'
          import re
          import html

          txt = open("raw.txt","r",encoding="utf-8").read().splitlines()

          header_pattern = re.compile(r"^\d{2}:\d{2} \[[gy]\].+?\[z\]")
          url_pattern = re.compile(r"https?://\S+")

          filtered = []
          has_valid_header = False

          for line in txt:
              line = html.unescape(line.strip())
              if not line:
                  continue

              # detect valid header
              if header_pattern.match(line):
                  has_valid_header = True
                  filtered.append(line)
                  continue

              # skip semua sebelum header valid
              if not has_valid_header:
                  continue

              filtered.append(line)

          with open("filtered.txt","w",encoding="utf-8") as f:
              f.write("\n".join(filtered) + "\n")

          print("FILTER DONE:", len(filtered))
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: filtered
          path: filtered.txt


# =========================
# STEP 3 - FORMAT FINAL OUTPUT (STRICT RULE)
# =========================
  format:
    needs: filter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: filtered

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Build final jadwal (STRICT BLOCK ONLY)
        run: |
          python - << 'EOF'
          import re
          import html

          txt = open("filtered.txt","r",encoding="utf-8").read().splitlines()

          header_pattern = re.compile(r"^(\d{2}:\d{2}) \[[gy]\](.+?)\[z\]")
          url_pattern = re.compile(r"https?://\S+")

          output = []

          current_time = None
          current_league = None

          for line in txt:
              line = html.unescape(line.strip())

              if not line:
                  continue

              # HEADER (WAJIB VALID)
              h = header_pattern.match(line)
              if h:
                  current_time = h.group(1)
                  current_league = h.group(2).strip()
                  continue

              # ❌ skip kalau belum ada header valid
              if not current_time or not current_league:
                  continue

              urls = url_pattern.findall(line)

              for url in urls:

                  # FILTER STRICT
                  if ".m3u8" not in url:
                      continue
                  if "`F" in line or "`0" in line:
                      continue

                  name = line.split(url)[0]
                  name = name.replace("`F","").replace("`0","").strip()

                  output.append(f"{current_league}#{current_time} {name}#{url}")

          with open("schedule.txt","w",encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")

          print("FINAL OUTPUT:", len(output))
          EOF

      - name: Commit result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add schedule.txt
          git commit -m "Update strict IPTV jadwal" || echo "No changes"
          git push
