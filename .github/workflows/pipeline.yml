name: Stable Pipeline Extract → Filter → Format

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-data]

jobs:

# =========================
# STEP 1 - EXTRACT (NO CACHE)
# =========================
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Fetch source (ANTI CACHE + FRESH)
        run: |
          python - << 'EOF'
          import requests, time

          url = "https://raw.githubusercontent.com/englishcd/ai/main/a0a.txt?ts=" + str(int(time.time()))

          headers = {
              "Cache-Control": "no-cache",
              "Pragma": "no-cache"
          }

          txt = requests.get(url, headers=headers, timeout=30).text

          import re

          pattern = r"(\d{2}:\d{2} \[[gy]\].*?\[z\]\s+\^\-(?:\n[^\n]+ vs [^\n]+\s+(`F)?https?://[^\s]+)+)"
          blocks = re.findall(pattern, txt)

          with open("blocks_clean.txt", "w", encoding="utf-8") as f:
              for b in blocks:
                  f.write(b[0] + "\n\n")

          print("Extract:", len(blocks))
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: step1
          path: blocks_clean.txt


# =========================
# STEP 2 - FILTER (ARTIFACT ONLY)
# =========================
  filter:
    needs: extract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: step1

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Filter M3U8 only
        run: |
          python - << 'EOF'
          import re

          with open("blocks_clean.txt","r",encoding="utf-8") as f:
              lines = f.read().splitlines()

          url_pattern = re.compile(r"https?://\S+")

          filtered = []
          for line in lines:
              if url_pattern.search(line) and ".m3u8" not in line:
                  continue
              filtered.append(line)

          with open("blocks_m3u8.txt","w",encoding="utf-8") as f:
              f.write("\n".join(filtered) + "\n")

          print("Filter done")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: step2
          path: blocks_m3u8.txt


# =========================
# STEP 3 - FORMAT + COMMIT FINAL
# =========================
  format:
    needs: filter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3   # WAJIB untuk push

      - uses: actions/download-artifact@v4
        with:
          name: step2

      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - run: pip install requests

      - name: Format final output
        run: |
          python - << 'EOF'
          import re

          txt = open("blocks_m3u8.txt","r",encoding="utf-8").read().splitlines()

          header_pattern = re.compile(r"(\d{2}:\d{2}) \[[gy]\](.*)\[z\]\s+\^\-")
          m3u8_pattern = re.compile(r"(.+?)\s+(https?://.*\.m3u8.*)")

          output = []
          current_time = ""
          current_league = ""

          for line in txt:
              line = line.strip()
              if not line:
                  continue

              h = header_pattern.match(line)
              if h:
                  current_time = h.group(1)
                  current_league = h.group(2).strip()
                  continue

              m = m3u8_pattern.match(line)
              if m:
                  name = m.group(1).strip()
                  url = m.group(2).strip()
                  output.append(f"{current_league}#{current_time} {name}#{url}")

          with open("schedule.txt","w",encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")

          print("Final lines:", len(output))
          EOF

      - name: Commit final result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add schedule.txt
          git commit -m "Update jadwal (stable pipeline)" || echo "No changes"
          git push
