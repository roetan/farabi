name: Filter

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  filter-m3u8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch TXT and Filter URLs
        run: |
          python - << 'EOF'
          import requests
          import re

          url = "https://raw.githubusercontent.com/roetan/farabi/refs/heads/main/blocks_clean.txt"
          response = requests.get(url)
          response.raise_for_status()
          lines = response.text.splitlines()

          # regex untuk mendeteksi URL
          url_pattern = re.compile(r"https?://\S+")

          filtered_lines = []
          for line in lines:
              # jika line ada URL tapi tidak ada .m3u8 -> skip
              if url_pattern.search(line) and ".m3u8" not in line:
                  continue
              filtered_lines.append(line)

          output_file = "blocks_m3u8_filtered.txt"
          with open(output_file, "w", encoding="utf-8") as f:
              f.write("\n".join(filtered_lines) + "\n")

          print(f"Filtered lines with only .m3u8 URLs and saved to {output_file}")
          EOF

      - name: Commit and Push Filtered TXT
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add blocks_m3u8_filtered.txt
          git commit -m "Update filtered .m3u8 blocks" || echo "No changes to commit"
          git push
